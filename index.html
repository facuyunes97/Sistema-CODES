<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODES Construcciones</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#252525">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CODES">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEEEE; --surface:#FAFAFA; --ink:#262626; --ink-2:#5F5F5F; --line:#D4D4D4;
  --side:#262626; --side-2:#3B3B3B; --side-ink:#EDEDED; --side-mute:#B1B1B1;
  --accent:#D80000; --accent-ink:#FFFFFF; --accent-soft:#F8DCDC;
  --good:#2B7A4B; --good-soft:#DDEDE3; --warn:#A76F00; --warn-soft:#F5E8C9; --bad:#A93A2F; --bad-soft:#F4DAD6;
  --radius:6px;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2)}
.mes-grp{margin:0 0 14px}.mes-grp>summary{cursor:pointer;padding:10px 4px;font-size:16px;list-style:revert}.mes-grp>summary b{font-family:var(--f-head);font-size:18px}
.num{text-align:right;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- pantallas de acceso ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:#E8E8E8}
.gate-box{width:100%;max-width:400px;padding:8px 4px}
.gate-box .logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 20px}
.gate-box h1{font-size:26px;line-height:1.1;margin-bottom:6px}
.gate-box p{margin:0 0 18px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-weight:500;font-size:14px}
.field .hint{font-size:13px;color:var(--ink-2)}
input,select,textarea{width:100%;background:#fff;border:1px solid #B5B5B5;border-radius:var(--radius);padding:9px 10px;min-height:40px}
textarea{min-height:76px;resize:vertical}
.money{display:flex;align-items:stretch;background:#fff;border:1px solid #B5B5B5;border-radius:var(--radius);min-height:40px}
.money:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.money .cur{display:flex;align-items:center;justify-content:center;min-width:46px;padding:0 10px;background:#F1F1F1;border-right:1px solid #D4D4D4;font-weight:600;border-radius:5px 0 0 5px}
.money input{border:0;background:transparent;text-align:right;min-width:0;flex:1;font-variant-numeric:tabular-nums;outline:none}
input:disabled,select:disabled,textarea:disabled{background:#F0F0F0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.msg{padding:10px 12px;border-radius:var(--radius);margin:0 0 14px;font-size:14px}
.msg.err{background:var(--bad-soft);color:#6F231B}
.msg.ok{background:var(--good-soft);color:#1B4F31}
.msg.warn{background:var(--warn-soft);color:#5E3F00}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{border-bottom:1px solid var(--side-2)}
.brand{padding:6px 14px 14px}
.brand img{display:block;width:100%;max-width:216px;height:auto}
.brand span{display:block;font-size:13px;color:var(--side-mute);padding:0 6px}
.nav{padding:12px 10px;flex:1}
.nav h3{font-size:13px;font-weight:500;color:var(--side-mute);padding:14px 10px 4px;font-family:var(--f-body)}
.nav a{display:block;padding:7px 10px;border-radius:var(--radius);color:var(--side-ink);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--side-2)}
.nav a[aria-current=page]{background:var(--accent);color:#fff;font-weight:600}
.me{padding:14px 20px;border-top:1px solid var(--side-2);font-size:13px;color:var(--side-mute)}
.me b{display:block;color:var(--side-ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.me button{margin-top:8px;background:none;border:1px solid var(--side-2);color:var(--side-ink);border-radius:var(--radius);padding:5px 10px;cursor:pointer}
.topbar{display:none}
.main{padding:28px 32px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:30px;line-height:1.1}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{margin:0;min-width:150px}
.toolbar .grow{flex:1;min-width:200px}

/* ---------- tablas ---------- */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #E6E6E6;white-space:nowrap}
th{font-weight:600;font-size:13.5px;color:var(--ink-2);background:#F1F1F1;position:sticky;top:0}
th.num,td.num{text-align:right}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:#F3F3F3}
tfoot td{font-weight:600;background:#F1F1F1;border-bottom:0}
td.wrap{white-space:normal;min-width:180px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-family:var(--f-head)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:500;background:#E6E6E6;color:var(--ink-2)}
.b-en_ejecucion,.b-preventivo{background:var(--accent-soft);color:#7A0000}
.b-finalizada,.b-cobrado,.b-pagada,.b-operativa{background:var(--good-soft);color:#1B4F31}
.b-pausada,.b-parcial,.b-en_mantenimiento,.b-correctivo,.b-pendiente{background:var(--warn-soft);color:#5E3F00}
.b-fuera_de_servicio,.b-vencida{background:var(--bad-soft);color:#6F231B}
.b-ingreso{background:var(--good-soft);color:#1B4F31}
.b-egreso,.b-gasto{background:#E6E6E6;color:#3B3B3B}
dialog.wide{width:min(1280px,calc(100vw - 16px))}
.sheet{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.sheet table{min-width:1120px;table-layout:fixed}
.sheet th{z-index:1}
.sheet td{padding:0;border-right:1px solid #E6E6E6}
.sheet input,.sheet select{border:0;border-radius:0;min-height:36px;background:transparent;padding:6px 8px;font-size:14px}
.sheet input:focus,.sheet select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
.sheet input:disabled{background:#F0F0F0}
.sheet input.num{text-align:right}
.sheet tr.warn td{background:#FFF6D6}
.sheet tr.bad td{background:var(--bad-soft)}
.sheet td.arch{padding:6px 8px;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:30px 16px;margin-top:6px;border:2px dashed #BDBDBD;border-radius:var(--radius);background:#fff;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:#FFF5F5}
.flist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.flist li{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.flist .fn{font-weight:600;overflow-wrap:anywhere}.flist .fs{color:var(--ink-2);flex:1 1 260px;text-align:right;overflow-wrap:anywhere}
.flist li.error .fs{color:#B00020}.flist li.ok .fs{color:#1B6E3A}
.imp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.bar{display:block;height:8px;background:var(--accent);border-radius:2px;min-width:1px}
.stat.neg b{color:var(--bad)}
.cal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cal-head h4{font:600 20px var(--f-head);min-width:150px;text-align:center;margin:0}
.cal-sum{margin-left:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:#fff}
.cal .dow{padding:6px 8px;font-weight:600;font-size:13px;background:#F0F0F0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .day{min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.blank{background:#F7F7F7}
.cal .day.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .dn{font-size:13px;color:var(--ink-2);font-weight:600}.cal .dw{display:none}
.chq{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;border:0;border-left:4px solid;border-radius:4px;padding:3px 6px;font-size:12px;line-height:1.25;cursor:pointer;min-width:0}
.chq b{font-variant-numeric:tabular-nums}.chq span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chq.egr{background:var(--bad-soft);border-color:var(--bad);color:#5c1d17}
.chq.ing{background:var(--good-soft);border-color:var(--good);color:#17432a}
.chq.rech{text-decoration:line-through;opacity:.6}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}.dot.egr{background:var(--bad)}.dot.ing{background:var(--good)}
@media(max-width:760px){.cal{display:block;border:0}.cal .dow,.cal .day.blank,.cal .day:not(.has){display:none}.cal .day{min-height:0;border:1px solid var(--line);margin-bottom:6px;border-radius:var(--radius)}.cal .dw{display:inline;margin-left:6px;font-weight:400}.cal-sum{margin-left:0}}
.docfield{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet-tot{font-variant-numeric:tabular-nums}
.pivot td:first-child,.pivot th:first-child{position:sticky;left:0;background:#F1F1F1;z-index:1}
.pivot tbody td:first-child{background:var(--surface)}
.b-anulado{background:#E6E6E6;color:var(--ink-2);text-decoration:line-through}

/* ---------- medidor de presupuesto ---------- */
.gauge{height:10px;border-radius:2px;background:#DCDCDC;overflow:hidden;box-shadow:inset 0 0 0 1px #C6C6C6}
.gauge-fill{height:100%;background:#4A4A4A}
.gauge.warn .gauge-fill{background:#C58A0B}
.gauge.bad .gauge-fill{background:var(--bad)}
.gauge-txt{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.gauge-txt b{color:var(--ink)}

/* ---------- inicio ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:28px}
.stat{padding:14px 18px 14px 0;margin-right:18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0;margin-right:0}
.stat span{display:block;font-size:14px;color:var(--ink-2)}
.stat b{display:block;font:600 30px/1.15 var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{color:var(--ink-2);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px;align-items:start}
.sec-title{font-size:21px;margin-bottom:10px}
.aud{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.aud b{display:inline-block;min-width:26px;padding:2px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;text-align:center;font-weight:700;letter-spacing:.3px}
.aud i{font-style:normal;font-size:11px;color:var(--muted)}
.aud-foot{grid-column:1/-1;margin:10px 0 0;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.cod{font-size:28px;font-weight:700;letter-spacing:4px;font-family:ui-monospace,Consolas,monospace;background:var(--accent-soft);color:var(--accent);padding:8px 16px;border-radius:10px;display:inline-block}
.sel-mini{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--radius);padding:26px 28px;margin-bottom:26px;position:relative;overflow:hidden}
.hero img.hl{height:46px;width:auto;display:block;margin-bottom:14px;mix-blend-mode:multiply}
.hero h2{font-size:30px;line-height:1.1;margin-bottom:8px}
.hero p{margin:0 0 10px;color:var(--ink-2);max-width:60ch}
.hero .who{font-size:13px;color:var(--ink-2)}
.hero .skl{position:absolute;right:-6px;bottom:-6px;width:55%;opacity:.07;pointer-events:none}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;position:relative}
.mods a{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;transition:border-color .15s,transform .15s}
.mods a:hover{border-color:var(--accent);transform:translateY(-1px)}
.mods b{display:block;font-family:var(--f-head);font-size:16px;margin-bottom:2px}
.mods span{font-size:12.5px;color:var(--ink-2);line-height:1.3;display:block}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding:20px 18px}.hero h2{font-size:25px}}
@media print{.hero .skl{display:none}}

.obra-row{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.obra-row:first-of-type{padding-top:4px}
.obra-row .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;align-items:baseline}
.obra-row .top b{font:600 18px var(--f-head)}
.todo{list-style:none;margin:0;padding:0}
.todo li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.todo li small{display:block;color:var(--ink-2)}
.todo .tag{font-weight:600;margin-right:6px}
.tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)}

/* ---------- formularios ---------- */
dialog{border:1px solid var(--line);border-radius:var(--radius);padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(24,34,40,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 26px)}
.dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-head h2{font-size:23px}
.dlg-body{padding:18px 20px 4px;overflow:auto}
.dlg-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .left{margin-right:auto;display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid2 .full{grid-column:1/-1}
.calc{padding:9px 10px;border:1px dashed #B5B5B5;border-radius:var(--radius);background:#F1F1F1;font-variant-numeric:tabular-nums;min-height:40px}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--ink-2);padding:2px 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--radius);z-index:50}
.aplic td{padding:8px 10px}
.aplic input{min-width:110px;text-align:right}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--side);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:10}
  .topbar button{background:none;border:1px solid var(--side-2);color:#fff;border-radius:var(--radius);padding:6px 12px;cursor:pointer}
  .topbar img{display:block;height:36px;width:auto}
  .main{padding:20px 14px 50px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0;margin-right:0}
  .cols{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:700px){
  .main{padding:16px 12px 50px}
  .page-head h2{font-size:26px}
  .page-head p{display:none}
  .page-head>div:last-child{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
  .page-head .btn{width:100%;padding:9px 6px;font-size:14px;text-align:center;line-height:1.25}
  .page-head .btn:not(.ghost):not(.plain){grid-column:1/-1;order:-1;padding:12px 8px;font-size:15px}
  .toolbar{gap:8px}
  .toolbar .field{min-width:0;flex:1 1 calc(50% - 8px)}
  .toolbar .grow{flex:1 1 100%;min-width:0}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:12px 10px 12px 0;margin-right:10px}
  .stat b{font-size:21px}
  .stat span{font-size:13px}
  .tablewrap{border:0;background:transparent;overflow:visible}
  table.cards{display:block;background:transparent}
  table.cards thead{display:none}
  table.cards tbody,table.cards tfoot{display:block}
  table.cards tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
  table.cards td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border:0;padding:4px 0;white-space:normal;text-align:right!important;font-size:15px}
  table.cards td::before{content:attr(data-l);color:var(--ink-2);font-size:13px;text-align:left;flex:0 0 40%}
  table.cards td:empty{display:none}
  table.cards td:first-child{font-weight:700;font-size:16px;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:3px}
  table.cards tfoot td{font-weight:600}
  table.cards tfoot td::before{content:''}
  table.cards tr[data-id]:active{background:var(--accent-soft)}
  table.pivot{display:table}
  table.pivot thead{display:table-header-group}
  table.pivot tbody{display:table-row-group}
  table.pivot tr{display:table-row;border:0;padding:0;margin:0;background:none}
  table.pivot td{display:table-cell;text-align:left!important}
  table.pivot td::before{content:none}
  details.mes-grp summary{line-height:1.5}
  dialog{width:100vw;max-width:100vw;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* decoración: máquinas viales, sutil y detrás del contenido */
.deco-bottom{position:fixed;left:244px;right:0;bottom:0;height:150px;z-index:0;pointer-events:none;color:var(--ink);opacity:.075;overflow:hidden}
.deco-bottom svg{position:absolute;right:28px;bottom:6px;height:130px;width:auto}
.main{position:relative;z-index:1}
.side-deco{padding:0 16px 12px;color:#fff;opacity:.16;pointer-events:none}.side-deco svg{display:block;width:100%;height:auto}
.head-deco{color:var(--accent);opacity:.55;pointer-events:none}.head-deco svg{display:block;width:250px;height:auto}
.gate{position:relative;overflow:hidden}.gate-box{position:relative;z-index:1}
.gate-deco{position:absolute;left:0;right:0;bottom:0;z-index:0;pointer-events:none;color:var(--ink);opacity:.13;display:flex;justify-content:center}.gate-deco svg{width:min(980px,100%);height:auto;display:block}

  const v = el.value, pos = el.selectionStart ?? v.length;
  const cnt = (v.slice(0, pos).match(/[0-9,]/g) || []).length;
  const clean = v.replace(/[^0-9,]/g, ''), ci = clean.indexOf(',');
  let int = ci < 0 ? clean : clean.slice(0, ci);
  const dec = ci < 0 ? null : clean.slice(ci + 1).replace(/,/g, '').slice(0, 2);
  int = int.replace(/^0+(?=\d)/, '');
  if (int === '' && dec !== null) int = '0';
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const out = int + (dec === null ? '' : ',' + dec);
  el.value = out;
  let c = 0, i = 0;
  for (; i < out.length && c < cnt; i++) if (/[0-9,]/.test(out[i])) c++;
  try { el.setSelectionRange(i, i); } catch (_) {}
}

function niceError(e) {
  const m = (e && e.message) || String(e);
  if (e?.code === '42P01' || e?.code === 'PGRST205' || /does not exist|Could not find the table/i.test(m))
    return 'Todavía no existen las tablas en tu proyecto de Supabase. Ejecutá el archivo schema_constructora_v1.sql en el editor SQL de Supabase y recargá la página.';
  if (e?.code === '42501' || /row-level security|permission denied/i.test(m)) return 'Tu usuario no tiene permiso para hacer esto.';
  if (e?.code === '23505' && /obras_codigo_key/.test(m)) return 'Ya hay otra obra con ese código. Cada obra tiene su propio código: dejalo vacío y el sistema le pone uno.';
  if (e?.code === '23505' && /empleados_nombre_unico/.test(m)) return 'Ya hay una persona cargada con ese nombre. Cada nombre puede estar una sola vez.';
  if (e?.code === '23505') return 'Ya existe un registro con esos datos (código o comprobante repetido).';
  if (e?.code === '23503') return 'No se puede completar: el registro está relacionado con otros datos.';
  if (e?.code === '23514') return 'Hay un dato fuera de rango. Revisá importes, fechas y horómetros.';
  if (e?.code === '23502') return 'Falta completar un dato obligatorio.';
  if (/Invalid login/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Falta confirmar tu email. Revisá tu correo.';
  return m;
}

function downloadCSV(name, headers, rows) {
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const txt = '\uFEFF' + [headers, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function loadLookups() {

const audName = id => id ? (AUD.users.get(id) || 'Usuario eliminado') : '';
function iniciales(id) {
  if (!id) return ''; const n = AUD.users.get(id); if (!n) return '?';
  const w = n.split('@')[0].split(/[\s._-]+/).filter(Boolean); if (!w.length) return '?';
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0].slice(0, 2)).toUpperCase();
}
const audFecha = t => { if (!t) return ''; const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const AUD_TABLA = { caja: 'caja_movimientos', cobro: 'cuentas_cliente', pago: 'pagos_proveedor', banco: 'banco_movimientos', traspaso: 'banco_traspasos' };
function audOf(r) {

  return AUD.rows.get((AUD_TABLA[o] || '') + ':' + id) || {};
}
async function audLoad(tablas) {

function tableHtml(cols, rows, { rowId = false, totals = null } = {}) {

  return `<div class="tablewrap"><table class="cards"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}

    const { data, error } = await q.order('id', { ascending: false }).limit(1000);

    rows = data.reverse(); if (E.afterLoad) await E.afterLoad(rows);
    if (E.mixto) { const ve = await sb.from('facturas_emitidas').select('*').order('fecha', { ascending: false }).order('id', { ascending: false }).limit(1000); if (ve.error) throw ve.error; rows = rows.concat(ve.data.reverse().map(x => ({ ...x, _venta: 1, _raw: x, id: 'v' + x.id }))); }
  } catch (e) { $('#list').innerHTML = `<div class="msg err">${esc(niceError(e))}</div>`; return; }

  let lastShown = [];
  const draw = () => {
    const term = $('#q').value.trim().toLowerCase();
    let shown = E.mixto && $('#ftipo').value ? rows.filter(r => ($('#ftipo').value === 'v') === !!r._venta) : rows;
    shown = term ? shown.filter(r => CC.map(c => plain(c, r)).join(' ').toLowerCase().includes(term)) : shown;
    (E.filters || []).forEach(f => { const v = $('#flt_' + f.id).value; if (v) shown = shown.filter(r => f.test(r, v)); });
    lastShown = E.porMes ? [...shown].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))) : shown;
    if (E.porMes && shown.length) {
      const g = new Map(); [...shown].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || String(b.id).localeCompare(String(a.id), undefined, { numeric: true })).forEach(r => { const k = String(r.fecha).slice(0, 7); (g.get(k) || g.set(k, []).get(k)).push(r); });
      const open = draw.open || (draw.open = new Set([[...g.keys()][0]]));
      $('#list').innerHTML = [...g].map(([k, rs]) => { const tot = r2(rs.reduce((a, r) => a + Number(r.importe || 0), 0)), iva = r2(rs.reduce((a, r) => a + Number(r.iva || 0), 0)); return `<details class="mes-grp" data-k="${k}" ${open.has(k) || term ? 'open' : ''}><summary><b>${MESES[Number(k.slice(5)) - 1]} ${k.slice(0, 4)}</b><span class="muted"> · ${rs.length} ${rs.length === 1 ? 'factura' : 'facturas'}${E.mixto ? ` · Compras ${fmtMoney(r2(rs.filter(r => !r._venta).reduce((a, r) => a + Number(r.importe || 0), 0)))} (IVA crédito ${fmtMoney(r2(rs.filter(r => !r._venta).reduce((a, r) => a + Number(r.iva || 0), 0)))}) · Ventas ${fmtMoney(r2(rs.filter(r => r._venta).reduce((a, r) => a + Number(r.importe || 0), 0)))} (IVA débito ${fmtMoney(r2(rs.filter(r => r._venta).reduce((a, r) => a + Number(r.iva || 0), 0)))})` : ` · Total ${fmtMoney(tot)} · IVA ${fmtMoney(iva)}`}</span></summary>${tableHtml(CC, rs, { rowId: true })}</details>`; }).join('') + `<p class="muted" style="margin-top:8px">${shown.length} ${shown.length === 1 ? 'registro' : 'registros'}${canEdit() ? '. Tocá una fila para editarla.' : '.'}${E.summary ? ' · ' + E.summary(shown) : ''}</p>`;
      $('#list').querySelectorAll('details.mes-grp').forEach(d => d.addEventListener('toggle', () => { d.open ? open.add(d.dataset.k) : open.delete(d.dataset.k); }));
      return;
    }
    $('#list').innerHTML = shown.length
      ? tableHtml(CC, shown, { rowId: true }) + `<p class="muted" style="margin-top:8px">${shown.length} ${shown.length === 1 ? 'registro' : 'registros'}${canEdit() ? '. Tocá una fila para editarla.' : '.'}${E.summary ? ' · ' + E.summary(shown) : ''}</p>`
      : `<div class="tablewrap"><div class="empty"><b>${term ? 'Sin resultados' : 'Todavía no hay datos'}</b>${term ? 'Probá con otra palabra.' : esc(E.emptyMsg)}</div></div>`;
  };
  const fillFilters = () => (E.filters || []).forEach(f => { const el = $('#flt_' + f.id), cur = el.value; let list = lookups[f.ref]; if (f.dep) { const dv = $('#flt_' + f.dep).value; if (dv) list = list.filter(o => f.depTest(o, dv)); } el.innerHTML = `<option value="">Todos</option>` + list.map(o => `<option value="${o.id}">${esc(LK[f.ref](o))}</option>`).join(''); el.value = [...el.options].some(o => o.value === cur) ? cur : ''; });
  fillFilters(); draw();
  (E.filters || []).forEach(f => $('#flt_' + f.id).addEventListener('change', () => { fillFilters(); draw(); }));
  $('#q').addEventListener('input', draw);
  $('#ftipo')?.addEventListener('change', draw);
  $('#xls').onclick = () => { if (!lastShown.length) return toast('No hay nada para exportar.'); const cols = E.porMes ? [{ l: 'Mes', v: r => { const k = String(r.fecha).slice(0, 7); return `${MESES[Number(k.slice(5)) - 1]} ${k.slice(0, 4)}`; } }, ...CC] : CC; downloadTable(`${key}-${todayStr()}.xlsx`, cols, lastShown, E.title); };
  $('#fnewv')?.addEventListener('click', () => openForm('emitidas', null, refresh));
  $('#new')?.addEventListener('click', () => openForm(key, null, refresh));
  $('#fplan')?.addEventListener('click', () => openPlanillaFacturas(refresh));
  $('#fia')?.addEventListener('click', () => { location.hash = '#/importar-facturas'; });
  $('#ffisc')?.addEventListener('click', () => { location.hash = '#/fiscal'; });
  const open = tr => { const row = rows.find(r => String(r.id) === tr.dataset.id); if (row) row._venta ? openForm('emitidas', row._raw, refresh) : openForm(key, row, refresh); };
  $('#list').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) open(tr); });
  $('#list').addEventListener('keydown', e => { if (e.key === 'Enter') { const tr = e.target.closest('tr[data-id]'); if (tr) open(tr); } });
  async function refresh() { await loadLookups(); if (currentRoute() === key) renderCrud(key); }
}

/* ================= formulario ================= */
function fieldHtml(f, v, disabled, row) {
  const id = 'f_' + f.k, d = disabled ? 'disabled' : '', r = f.req ? 'required' : '';
  const usdNow = row?.moneda === 'USD';
  const usdAttr = (f.usd ? ` data-usd${usdNow ? '' : ' hidden'}` : '') + (f.cheq ? ` data-cheq${['Cheque', 'Echeq'].includes(row?.medio) ? '' : ' hidden'}` : '') + (f.tras ? ` data-tras${row?.tipo === 'traspaso' ? '' : ' hidden'}` : '') + (f.notras ? ` data-notras${row?.tipo === 'traspaso' ? ' hidden' : ''}` : '');
  let ctl;
  if (f.t === 'money' || f.t === 'cot') {
    const val = f.t === 'cot' ? (usdNow ? row.cotizacion : '') : (row?.[f.orig] ?? v);
    ctl = `<div class="money"><span class="cur"${f.t === 'money' ? ' data-cur' : ''}>${f.t === 'money' && usdNow ? 'US$' : '$'}</span><input id="${id}" name="${f.k}" inputmode="decimal" autocomplete="off" placeholder="0,00" data-money value="${esc(moneyStr(val))}" ${f.t === 'money' ? r : ''} ${d}></div>`;
    return `<div class="field${f.full ? ' full' : ''}"${usdAttr}><label for="${id}">${esc(f.l)}${f.req || f.t === 'cot' ? '' : ' <span class="muted" style="font-weight:400">(opcional)</span>'}</label>${ctl}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
  }
  if (f.t === 'textarea') ctl = `<textarea id="${id}" name="${f.k}" ${d}>${esc(v ?? '')}</textarea>`;
  else if (f.t === 'sel' || f.t === 'fk') {
    const opts = f.t === 'sel' ? f.opts : (f.filter ? lookups[f.ref].filter(f.filter) : lookups[f.ref]).map(x => [x.id, LK[f.ref](x)]);
    ctl = `<select id="${id}" name="${f.k}" ${r} ${d}><option value="">${f.req ? 'Elegir…' : 'Sin asignar'}</option>${opts.map(([o, t]) => `<option value="${esc(o)}"${String(v) === String(o) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  } else if (f.t === 'doc') ctl = `<div class="docfield"><input type="hidden" id="${id}" name="${f.k}" value="${esc(v ?? '')}"><span class="muted" data-docname>${v ? 'Hay un archivo adjunto.' : 'Sin archivo adjunto.'}</span><button type="button" class="btn plain" data-docview${v ? '' : ' hidden'}>Ver</button>${disabled ? '' : `<button type="button" class="btn plain" data-docpick>${v ? 'Cambiar archivo' : 'Adjuntar archivo'}</button><input type="file" hidden accept="${ACCEPT}" data-docfile>`}</div>`;
  else if (f.t === 'calc') ctl = `<div class="calc" id="${id}" data-calc="${f.k}" aria-live="polite"></div>`;
  else ctl = `<input id="${id}" name="${f.k}" type="${f.t === 'number' ? 'number' : f.t}" ${f.t === 'number' ? `step="${f.step || 'any'}"` : ''} value="${esc(v ?? '')}" ${r} ${d}>`;
  return `<div class="field${f.full ? ' full' : ''}"${usdAttr}><label for="${id}">${esc(f.l)}${f.req || f.t === 'calc' || f.noOpt ? '' : ' <span class="muted" style="font-weight:400">(opcional)</span>'}</label>${ctl}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}

function openForm(key, row, onDone, preset) {
  const E = ENT[key], isNew = !row, editable = canEdit();
  const init = row ? row : { ...Object.fromEntries(E.fields.filter(f => f.def !== undefined).map(f => [f.k, typeof f.def === 'function' ? f.def() : f.def])), ...(preset || {}) };
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form class="dlg" novalidate><div class="dlg-head"><h2>${isNew ? (E.fem ? 'Nueva ' : 'Nuevo ') + esc(E.single) : (editable ? 'Editar ' : 'Ver ') + esc(E.single)}</h2><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="dlg-body"><div class="msg err" id="ferr" hidden></div><div class="grid2">${E.fields.map(f => fieldHtml(f, init[f.k], !editable, init)).join('')}${isNew ? '' : audFootHtml(row)}</div></div>
    <div class="dlg-foot"><div class="left">${!isNew && canDelete() ? '<button type="button" class="btn danger" data-del>Eliminar</button>' : ''}${!isNew && editable && E.extraButtons ? E.extraButtons(row) : ''}</div>
    <button type="button" class="btn plain" data-close>${editable ? 'Cancelar' : 'Cerrar'}</button>${editable ? '<button class="btn" type="submit">Guardar</button>' : ''}</div></form>`;
  document.body.appendChild(dlg);
  const form = $('form', dlg);
  const api = {
    get: n => { const el = form.elements[n]; if (!el) return ''; if (el.dataset.money !== undefined) { const x = parseMoney(el.value); return x === '' ? '' : String(x); } return el.value; },
    set: (n, v) => { const el = form.elements[n]; if (el) el.value = el.dataset.money !== undefined ? moneyStr(v) : (v ?? ''); recalc(); }
  };
  const syncMoneda = () => {
    if (!form.elements.moneda) return;
    const usd = form.elements.moneda.value === 'USD';
    form.querySelectorAll('[data-usd]').forEach(el => el.hidden = !usd);
    form.querySelectorAll('[data-cur]').forEach(el => el.textContent = usd ? 'US$' : '$');
    const cot = form.elements.cotizacion; if (cot) cot.required = usd && editable;
  };
  const esTras = () => E.table === 'banco_movimientos' && form.elements.tipo?.value === 'traspaso';
  const syncTras = () => {
    if (E.table !== 'banco_movimientos') return;
    const tr = esTras();
    if (tr && form.elements.moneda) form.elements.moneda.value = 'ARS';
    form.querySelectorAll('[data-tras]').forEach(el => el.hidden = !tr);
    form.querySelectorAll('[data-notras]').forEach(el => {
      if (tr) el.hidden = true; else if (!el.hasAttribute('data-cheq') && !el.hasAttribute('data-usd')) el.hidden = false;
      el.querySelectorAll('input,select,textarea').forEach(c => { if (c.dataset.req === undefined) c.dataset.req = c.required ? '1' : ''; c.required = !tr && c.dataset.req === '1' && editable; });
    });
    if (form.elements.cuenta_destino) form.elements.cuenta_destino.required = tr && editable;
    const lb = $('label[for="f_cuenta"]', form); if (lb) lb.textContent = tr ? 'Cuenta de origen' : 'Cuenta';
  };
  const syncMedio = () => {
    if (!form.elements.medio) return;
    const c = ['Cheque', 'Echeq'].includes(form.elements.medio.value) && !esTras();
    form.querySelectorAll('[data-cheq]').forEach(el => el.hidden = !c);
    if (form.elements.fecha_pago) form.elements.fecha_pago.required = c && editable;
  };
  const syncAll = () => { syncTras(); syncMoneda(); syncMedio(); };
  const recalc = () => E.fields.filter(f => f.t === 'calc').forEach(f => { $(`[data-calc="${f.k}"]`, form).textContent = f.calc(api); });
  const refreshRubros = () => {
    if (!E.rubroPorTipo) return;
    const rs = form.elements.rubro_id, cur = rs.value, t = form.elements.tipo.value === 'ingreso' ? 'ingreso' : 'gasto';
    rs.innerHTML = '<option value="">Elegir…</option>' + lookups.rubros.filter(r => r.tipo === t).map(r => `<option value="${r.id}">${esc(r.nombre)}</option>`).join('');
    if (lookups.rubros.some(r => String(r.id) === cur && r.tipo === t)) rs.value = cur;
  };
  refreshRubros(); syncAll(); recalc();
  form.addEventListener('input', e => { if (e.target.dataset.money !== undefined) liveMoney(e.target); if (e.target.name) { E.hook?.(e.target.name, api, isNew); recalc(); } });
  form.addEventListener('change', e => { if (e.target.name === 'moneda') syncMoneda(); if (e.target.name === 'medio') syncMedio(); if (e.target.name === 'tipo') { refreshRubros(); syncAll(); } if (e.target.name) { E.hook?.(e.target.name, api, isNew); recalc(); } });
  form.addEventListener('focusout', e => { if (e.target.dataset?.money !== undefined) { e.target.value = moneyStr(parseMoney(e.target.value)); recalc(); } });
  form.addEventListener('click', e => {
    if (e.target.closest('[data-docview]')) abrirDoc(Number(form.elements.documento_id.value));
    if (e.target.closest('[data-docpick]')) $('[data-docfile]', form).click();
  });
  form.addEventListener('change', async e => {
    if (!e.target.matches('[data-docfile]') || !e.target.files[0]) return;
    const b = $('[data-docpick]', form), name = $('[data-docname]', form); b.disabled = true; name.textContent = 'Subiendo…';
    try {
      const doc = await subirDocumento(await prepararArchivo(e.target.files[0]), 'adjunto', form.elements.obra_id?.value);
      form.elements.documento_id.value = doc.id; name.textContent = 'Adjunto: ' + doc.nombre; $('[data-docview]', form).hidden = false; b.textContent = 'Cambiar archivo';
    } catch (err) { name.textContent = niceError(err); }
    b.disabled = false; e.target.value = '';
  });
  dlg.addEventListener('click', e => { if (e.target.closest('[data-close]')) dlg.close(); });
  dlg.addEventListener('close', () => dlg.remove());
  dlg.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (x) { dlg.close(); E.onExtra?.(x.dataset.x, row); } });
  $('[data-del]', dlg)?.addEventListener('click', async () => {
    if (!(await askConfirm(`¿Eliminar este ${E.single}?`))) return;
    const { error } = await sb.from(row._tras ? 'banco_traspasos' : E.table).delete().eq('id', row.id);
    if (error) return showErr(niceError(error));
    dlg.close(); toast('Eliminado'); await onDone?.();
  });
  const showErr = t => { const b = $('#ferr', dlg); b.textContent = t; b.hidden = false; b.scrollIntoView({ block: 'nearest' }); };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    if (E.table === 'banco_movimientos') {
      const tr = esTras();
      if (!isNew && tr !== !!row._tras) return showErr('No se puede convertir un movimiento ya guardado en movimiento entre cuentas (ni al revés). Eliminalo y cargalo de nuevo.');
      if (tr) {
        const imp = parseMoney(form.elements.importe.value), o = form.elements.cuenta.value, d = form.elements.cuenta_destino.value;
        if (!(imp > 0)) return showErr('Ingresá el importe.');
        if (!d) return showErr('Elegí la cuenta de destino.');
        if (o === d) return showErr('La cuenta de origen y la de destino tienen que ser distintas.');
        const pl = { fecha: form.elements.fecha.value, cuenta_origen: o, cuenta_destino: d, importe: imp, concepto: form.elements.concepto.value.trim() || null, observaciones: form.elements.observaciones.value.trim() || null };
        const b2 = $('[type=submit]', dlg); b2.disabled = true;
        const r2 = await (isNew ? sb.from('banco_traspasos').insert(pl).select().single() : sb.from('banco_traspasos').update(pl).eq('id', row.id).select().single());
        b2.disabled = false;
        if (r2.error) return showErr(niceError(r2.error));
        dlg.close(); toast('Guardado'); await onDone?.(); return;
      }
    }
    const p = {}, usd = form.elements.moneda?.value === 'USD';
    for (const f of E.fields) {
      if (f.t === 'calc' || f.tras || f.nosave) continue;
      if (f.t === 'money') { const x = parseMoney(form.elements[f.k].value); p[f.orig || f.k] = x === '' ? null : x; continue; }
      if (f.t === 'cot') {
        const x = parseMoney(form.elements[f.k].value);
        if (usd && !(x > 1)) return showErr('Ingresá la cotización del dólar: cuántos pesos vale 1 dólar.');
        p.cotizacion = usd ? x : 1; continue;
      }
      const raw = form.elements[f.k].value.trim();
      p[f.k] = raw === '' ? null : (f.t === 'number' || f.t === 'fk' || f.t === 'doc') ? Number(raw) : raw;
    }
    Object.assign(p, E.fixed || {});
    if (E.table === 'banco_movimientos' && !['Cheque', 'Echeq'].includes(p.medio)) { p.fecha_pago = null; p.nro_cheque = null; }
    if (E.check) { const msg = await E.check(p, row, isNew); if (msg) return showErr(msg); }
    const btn = $('[type=submit]', dlg); btn.disabled = true;
    const q = isNew ? sb.from(E.table).insert(p).select().single() : sb.from(E.table).update(p).eq('id', row.id).select().single();
    const { data, error } = await q;
    btn.disabled = false;
    if (error) return showErr(niceError(error));
    dlg.close(); toast('Guardado');
    await onDone?.();
    E.afterSave?.(data, isNew);
  });
  dlg.showModal();
}


/* ===== obras de un cliente (un cliente puede tener varias obras, cada una con su contrato y forma de cobro) ===== */
async function openObrasCliente(cli) {
  const dlg = document.createElement('dialog'); dlg.className = 'wide';
  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><h2>Obras de ${esc(cli.razon_social)}</h2><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="dlg-body"><p class="muted" style="margin:0 0 10px">Cada obra tiene su propio contrato, presupuesto y forma de cobro. Tocá una para editarla.</p><div id="oclist"><p class="muted">Cargando…</p></div></div>
    <div class="dlg-foot"><div class="left">${canEdit() ? '<button type="button" class="btn" id="ocnew">Agregar obra</button>' : ''}</div><button type="button" class="btn plain" data-close>Cerrar</button></div></div>`;
  document.body.appendChild(dlg); let rows = [];
  const load = async () => {
    await loadLookups();
    const [a, b] = await Promise.all([sb.from('obras').select('*').eq('cliente_id', cli.id).order('fecha_inicio', { ascending: false, nullsFirst: false }), sb.from('v_resumen_obra').select('*').eq('cliente_id', cli.id)]);
    if (a.error) { $('#oclist', dlg).innerHTML = `<div class="msg err">${esc(niceError(a.error))}</div>`; return; }
    const rs = new Map((b.data || []).map(x => [x.obra_id, x])); rows = a.data.map(o => ({ ...o, cobrado: rs.get(o.id)?.cobrado ?? 0, por_cobrar: rs.get(o.id)?.por_cobrar ?? 0 }));
    const C = [{ l: 'Obra', v: r => r.nombre + (r.codigo ? ` (${r.codigo})` : '') }, { l: 'Contrato Nº', k: 'nro_contrato' }, { l: 'Estado', k: 'estado', t: 'badge' }, { l: 'Monto del contrato', k: 'monto_contrato', t: 'money' }, { l: 'Cobrado', k: 'cobrado', t: 'money' }, { l: 'Por cobrar', k: 'por_cobrar', t: 'money' }, { l: 'Cómo se cobra', k: 'forma_cobro' }];
    $('#oclist', dlg).innerHTML = rows.length ? tableHtml(C, rows, { rowId: true }) : '<div class="tablewrap"><div class="empty"><b>Este cliente todavía no tiene obras</b>Tocá "Agregar obra" para cargar la primera.</div></div>';
  };
  dlg.addEventListener('click', e => { if (e.target.closest('[data-close]')) dlg.close(); const tr = e.target.closest('tr[data-id]'); if (tr) { const o = rows.find(r => String(r.id) === tr.dataset.id); if (o) openForm('obras', o, load); } });
  dlg.addEventListener('close', () => { dlg.remove(); if (currentRoute() === 'clientes') renderCrud('clientes'); });
  $('#ocnew', dlg)?.addEventListener('click', () => openForm('obras', null, load, { cliente_id: cli.id }));
  dlg.showModal(); load();
}

/* ================= aplicar pago a facturas ================= */
async function openAplicar(pago) {
  const [fac, apl] = await Promise.all([
    sb.from('v_facturas_saldo').select('*').eq('proveedor_id', pago.proveedor_id).gt('saldo', 0).order('fecha'),
    sb.from('pagos_aplicaciones').select('importe').eq('pago_id', pago.id)
  ]);
  if (fac.error || apl.error) return toast(niceError(fac.error || apl.error));
  const yaAplicado = sum(apl.data, 'importe'), disponible = Number(pago.importe) - yaAplicado;
  const dlg = document.createElement('dialog');
  const body = fac.data.length ? `<div class="tablewrap aplic"><table><thead><tr><th>Fecha</th><th>Comprobante</th><th class="num">Saldo</th><th class="num">Aplicar</th></tr></thead><tbody>${fac.data.map(f => `<tr><td>${fmtDate(f.fecha)}</td><td>${esc([f.tipo_comprobante, f.nro_comprobante].filter(Boolean).join(' ') || 'Sin número')}</td><td class="num">${fmtMoney(f.saldo)}</td><td class="num"><input type="number" step="any" min="0" max="${f.saldo}" data-f="${f.id}" data-saldo="${f.saldo}" aria-label="Importe a aplicar a la factura del ${fmtDate(f.fecha)}"></td></tr>`).join('')}</tbody></table></div>`
    : '<div class="msg warn">Este proveedor no tiene facturas con saldo pendiente.</div>';
  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><h2>Aplicar pago a facturas</h2><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="dlg-body"><p style="margin-top:0">Pago de <b>${fmtMoney(pago.importe)}</b> a ${esc(lookupLabel('proveedores', pago.proveedor_id))}. Disponible para aplicar: <b id="disp">${fmtMoney(disponible)}</b>.</p>
    <div class="msg err" id="aerr" hidden></div>${body}</div>
    <div class="dlg-foot"><button class="btn plain" data-close>Cerrar</button>${fac.data.length ? '<button class="btn" id="asave">Guardar aplicación</button>' : ''}</div></div>`;
  document.body.appendChild(dlg);

  inputs.forEach(i => { const v = Math.min(auto, Number(i.dataset.saldo)); if (v > 0) { i.value = Math.round(v * 100) / 100; auto -= v; } });

    if (error) return err(niceError(error));

}

function gauge(costo, pres) {
  if (!pres) return '<div class="gauge-txt"><span>Sin presupuesto de costos cargado</span></div>';
  const pct = costo / pres * 100, cls = pct > 100 ? 'bad' : pct >= 90 ? 'warn' : '';
  return `<div class="gauge ${cls}" role="img" aria-label="Costos: ${Math.round(pct)}% del presupuesto"><div class="gauge-fill" style="width:${Math.min(pct, 100)}%"></div></div>
    <div class="gauge-txt"><span>${fmtMoney(costo)} de ${fmtMoney(pres)}</span><b>${Math.round(pct)}%${pct > 100 ? ' · sobre el presupuesto' : ''}</b></div>`;
}

async function downloadTable(name, cols, rows, sheet = 'Planilla') {
  cols = cols.flatMap(c => c.xls || [c]);
  const head = cols.map(c => c.l), body = rows.map(r => cols.map(c => rawVal(c, r)));
  const save = (blob, fname) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); };
  try { save(xlsxBlob(head, body, new Set(cols.map((c, i) => c.t === 'money' ? i : -1).filter(i => i >= 0)), sheet), name.replace(/\.csv$/, '.xlsx')); }
  catch (_) { downloadCSV(name.replace(/\.xlsx$/, '.csv'), head, body.map(r => r.map(x => typeof x === 'number' ? String(x).replace('.', ',') : x))); toast('Se descargó como CSV, que también abre en Excel.'); }
}

/* ---- planilla de carga estilo Excel ---- */
const PL_COLS = ['fecha', 'tipo', 'rubro', 'obra', 'concepto', 'moneda', 'cotiz', 'importe', 'comprobante'];
const PL_HEAD = ['Fecha', 'Tipo', 'Rubro', 'Obra', 'Concepto', 'Moneda', 'Cotización', 'Importe', 'Comprobante'];
const PL_W = [100, 88, 160, 160, 190, 72, 96, 140, 110];
const dmy = iso => { const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
function parseDateFlex(t) {
  t = String(t ?? '').trim(); let m;
  if ((m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; const iso = `${y}-${pad(+m[2])}-${pad(+m[1])}`; return isNaN(new Date(iso)) || +m[2] > 12 || +m[1] > 31 ? null : iso; }
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  return null;
}
function parseFlex(t) {
  let x = String(t ?? '').replace(/[^\d.,-]/g, '');
  if (!x) return '';
  if (x.includes(',')) return parseMoney(x);
  if (/^-?\d{1,3}(\.\d{3})+$/.test(x)) return Number(x.replace(/\./g, ''));
  const n = Number(x); return isFinite(n) ? n : '';
}

function openPlanilla(onDone, prefill, obraDef) {
  const rub = k => lookups.rubros.filter(r => r.tipo === k).map(r => `<option value="${r.id}">${esc(r.nombre)}</option>`).join('');
  const rowHtml = () => `<tr>
    <td><input data-c="fecha" value="${dmy(todayStr())}" placeholder="dd/mm/aaaa" inputmode="numeric" aria-label="Fecha"></td>
    <td><select data-c="tipo" aria-label="Tipo"><option value="egreso">Egreso</option><option value="ingreso">Ingreso</option></select></td>
    <td><select data-c="rubro" aria-label="Rubro"><option value="">Elegir…</option><optgroup label="Gastos">${rub('gasto')}</optgroup><optgroup label="Ingresos">${rub('ingreso')}</optgroup></select></td>
    <td><select data-c="obra" aria-label="Obra"><option value="">Empresa (general)</option>${lookups.obras.map(o => `<option value="${o.id}">${esc(LK.obras(o))}</option>`).join('')}</select></td>
    <td><input data-c="concepto" aria-label="Concepto"></td>
    <td><select data-c="moneda" aria-label="Moneda"><option value="ARS">$</option><option value="USD">US$</option></select></td>
    <td><input data-c="cotiz" data-money class="num" disabled placeholder="—" inputmode="decimal" aria-label="Cotización"></td>
    <td><input data-c="importe" data-money class="num" placeholder="0,00" inputmode="decimal" aria-label="Importe"></td>
    <td><input data-c="comprobante" aria-label="Comprobante"></td>${prefill ? '<td class="arch" data-c="archivo"></td>' : ''}</tr>`;
  const dlg = document.createElement('dialog'); dlg.className = 'wide';
  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><h2>${prefill ? 'Revisá lo que leyó la IA' : 'Planilla de carga'}</h2><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="dlg-body"><p class="muted" style="margin:0 0 10px">${prefill ? 'Corregí lo que haga falta: las filas en amarillo son las que la IA no tiene claras. No se guarda nada hasta que apretás "Guardar todo".' : 'Cargá varios movimientos juntos.'} Podés copiar filas desde Excel y pegarlas en la primera celda con Ctrl+V (columnas en este orden: ${PL_HEAD.join(', ')}). Con Enter bajás a la fila de abajo.</p>
    <div class="msg err" id="perr" hidden></div>
    <div class="sheet"><table><colgroup>${[...PL_W, ...(prefill ? [150] : [])].map(w => `<col style="width:${w}px">`).join('')}</colgroup><thead><tr>${[...PL_HEAD, ...(prefill ? ['Archivo'] : [])].map((h, i) => `<th class="${i > 5 && i < 8 ? 'num' : ''}">${h}</th>`).join('')}</tr></thead><tbody id="pbody"></tbody></table></div></div>
    <div class="dlg-foot"><div class="left"><button type="button" class="btn plain" id="padd">Agregar filas</button><button type="button" class="btn plain" id="pmodel">Descargar modelo de Excel</button></div>
    <span class="sheet-tot muted" id="ptot" aria-live="polite"></span><button type="button" class="btn plain" data-close>Cancelar</button><button type="button" class="btn" id="psave">Guardar todo</button></div></div>`;
  document.body.appendChild(dlg);
  const tb = $('#pbody', dlg);
  const addRow = () => { tb.insertAdjacentHTML('beforeend', rowHtml()); return tb.lastElementChild; };
  const cellOf = (tr, c) => tr.querySelector(`[data-c="${c}"]`);
  const totals = () => {
    let ing = 0, egr = 0;
    [...tb.rows].forEach(tr => { const imp = parseMoney(cellOf(tr, 'importe').value); if (imp === '') return; const usd = cellOf(tr, 'moneda').value === 'USD', cot = usd ? parseMoney(cellOf(tr, 'cotiz').value) : 1; if (!(cot > 0)) return; (cellOf(tr, 'tipo').value === 'ingreso' ? (ing += imp * cot) : (egr += imp * cot)); });
    $('#ptot', dlg).textContent = `Egresos ${fmtMoney(egr)} · Ingresos ${fmtMoney(ing)}`;
  };
  const setCell = (tr, col, raw) => {
    const el = cellOf(tr, col), v = String(raw ?? '').trim();
    if (col === 'fecha') { const iso = parseDateFlex(v); el.value = iso ? dmy(iso) : v; }
    else if (col === 'tipo') el.value = /^i/i.test(norm(v)) ? 'ingreso' : 'egreso';
    else if (col === 'rubro') { const n = norm(v), r = lookups.rubros.find(x => norm(x.nombre) === n) || (n ? lookups.rubros.find(x => norm(x.nombre).includes(n) || n.includes(norm(x.nombre))) : null); el.value = r ? r.id : ''; el.dataset.miss = !r && v ? v : ''; }
    else if (col === 'obra') { const n = norm(v), o = n && !/^(empresa|general|sin obra)/.test(n) ? lookups.obras.find(x => norm(x.nombre) === n || norm(x.codigo) === n) || lookups.obras.find(x => norm(x.nombre).includes(n)) : null; el.value = o ? o.id : ''; el.dataset.miss = !o && n && !/^(empresa|general|sin obra)/.test(n) ? v : ''; }
    else if (col === 'moneda') { el.value = /(us|d[oó]l)/i.test(v) ? 'USD' : 'ARS'; syncCot(tr); }
    else if (col === 'cotiz' || col === 'importe') { const x = parseFlex(v); el.value = x === '' ? '' : moneyStr(x); }
    else el.value = v;
  };
  const syncCot = tr => { const usd = cellOf(tr, 'moneda').value === 'USD', c = cellOf(tr, 'cotiz'); c.disabled = !usd; if (!usd) c.value = ''; };
  const fillCaja = (tr, f) => {
    setCell(tr, 'fecha', f.fecha ?? ''); setCell(tr, 'tipo', f.tipo); setCell(tr, 'rubro', f.rubro ?? '');
    if (f.obra) setCell(tr, 'obra', f.obra); else if (obraDef) cellOf(tr, 'obra').value = String(obraDef);
    const prov = f.proveedor && !norm(f.concepto).includes(norm(f.proveedor)) ? ` (${f.proveedor})` : '';
    setCell(tr, 'concepto', (f.concepto ?? '') + prov); setCell(tr, 'moneda', f.moneda === 'USD' ? 'USD' : 'ARS');
    if (f.moneda === 'USD' && f.cotizacion) cellOf(tr, 'cotiz').value = moneyStr(f.cotizacion);
    if (f.importe != null) cellOf(tr, 'importe').value = moneyStr(f.importe);
    setCell(tr, 'comprobante', f.comprobante ?? '');
    tr.dataset.doc = f._doc; cellOf(tr, 'archivo').textContent = f._arch || ''; cellOf(tr, 'archivo').title = f._arch || '';
    if (f.es_emitida === true && digits(f.cuit) !== CODES_CUIT) { tr.classList.add('warn'); tr.title = 'La emitió CODES SRL: es una venta (débito fiscal). Cargala en Facturas emitidas.'; }
    else if (f.confianza && f.confianza !== 'alta') { tr.classList.add('warn'); tr.title = 'La IA no está segura de esta fila. Revisala.'; }
  };
  if (prefill) { prefill.forEach(f => fillCaja(addRow(), f)); addRow(); addRow(); } else for (let i = 0; i < 10; i++) addRow();
  tb.addEventListener('input', e => { if (e.target.dataset.money !== undefined) liveMoney(e.target); totals(); });
  tb.addEventListener('change', e => { if (e.target.dataset.c === 'moneda') syncCot(e.target.closest('tr')); if (e.target.dataset.miss) e.target.dataset.miss = ''; totals(); });
  tb.addEventListener('focusout', e => { if (e.target.dataset?.money !== undefined) { e.target.value = moneyStr(parseMoney(e.target.value)); totals(); } });
  tb.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName === 'SELECT' && false) return;
    const tr = e.target.closest('tr'), col = e.target.dataset.c; if (!col) return; e.preventDefault();
    const next = tr.nextElementSibling || addRow(); cellOf(next, col).focus();
  });
  tb.addEventListener('paste', e => {
    const text = e.clipboardData?.getData('text/plain') ?? '';
    if (!/[\t\n]/.test(text.replace(/\r/g, '').replace(/\n$/, ''))) return;
    e.preventDefault();
    const cell = e.target.closest('[data-c]'); if (!cell) return;
    let ri = [...tb.rows].indexOf(cell.closest('tr')); const ci = PL_COLS.indexOf(cell.dataset.c);

      if (!(imp > 0)) e.push('falta el importe');
      if (usd && !(cot > 1)) e.push('falta la cotización');

      if (e.length) errs.push(`Fila ${i + 1}: ${e.join(', ')}`);
      else out.push({ fecha, tipo: g('tipo'), rubro_id: Number(g('rubro')), obra_id: g('obra') ? Number(g('obra')) : null, concepto, moneda: usd ? 'USD' : 'ARS', cotizacion: usd ? cot : 1, monto_moneda: imp, medio_pago: 'Efectivo', comprobante: g('comprobante') || null, documento_id: tr.dataset.doc ? Number(tr.dataset.doc) : null });
    });
    const fail = t => { box.innerHTML = t; box.hidden = false; box.scrollIntoView({ block: 'nearest' }); };
    if (errs.length) return fail('No se guardó nada. Corregí estas filas (están marcadas):<br>' + errs.slice(0, 8).map(esc).join('<br>') + (errs.length > 8 ? `<br>y ${errs.length - 8} más.` : ''));
    if (!out.length) return fail('No hay filas para guardar. Completá al menos una fila.');
    box.hidden = true; $('#psave', dlg).disabled = true;
    const { error } = await sb.from('caja_movimientos').insert(out);
    $('#psave', dlg).disabled = false;
    if (error) return fail(esc(niceError(error)));
    const dids = [...new Set(out.map(o => o.documento_id).filter(Boolean))];
    if (dids.length) await sb.from('documentos').update({ estado: 'cargado' }).in('id', dids);
    dlg.close(); toast(`${out.length} ${out.length === 1 ? 'movimiento guardado' : 'movimientos guardados'}`); await onDone?.();
  };
  totals(); dlg.showModal(); cellOf(tb.rows[0], 'concepto').focus();
}

async function openBancoRow(r, refresh) {
  if (r.origen === 'impuesto') return toast('Es el impuesto al débito y crédito, se calcula solo. Para no cobrarlo, abrí el movimiento original y marcalo como exento.');
  if (r.origen === 'traspaso') {
    const { data, error } = await sb.from('banco_traspasos').select('*').eq('id', r.origen_id).single();
    if (error) return toast(niceError(error));
    return openForm('banco', { ...data, tipo: 'traspaso', cuenta: data.cuenta_origen, _tras: 1 }, refresh);
  }
  if (r.origen !== 'banco') return toast(`Este movimiento viene de ${r.origen === 'cobro' ? 'Cobros a clientes' : 'Pagos a proveedores'}. Editalo desde esa pantalla.`);
  const { data, error } = await sb.from('banco_movimientos').select('*').eq('id', r.origen_id).single();

}

    <td><input data-c="nro" disabled placeholder="—" aria-label="Número de cheque"></td>
    <td><select data-c="rubro" aria-label="Rubro"><option value="">Elegir…</option><optgroup label="Gastos">${rub('gasto')}</optgroup><optgroup label="Ingresos">${rub('ingreso')}</optgroup></select></td>
    <td><select data-c="obra" aria-label="Obra"><option value="">Empresa (general)</option>${lookups.obras.map(o => `<option value="${o.id}">${esc(LK.obras(o))}</option>`).join('')}</select></td>

  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><h2>Planilla de Banco</h2><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>

    <div class="msg err" id="perr" hidden></div>
    <div class="sheet"><table style="min-width:1580px"><colgroup>${W.map(w => `<col style="width:${w}px">`).join('')}</colgroup><thead><tr>${H.map((h, i) => `<th class="${i === 12 ? 'num' : ''}">${h}</th>`).join('')}</tr></thead><tbody id="pbody"></tbody></table></div></div>
    <div class="dlg-foot"><div class="left"><button type="button" class="btn plain" id="padd">Agregar filas</button></div>
    <span class="sheet-tot muted" id="ptot" aria-live="polite"></span><button type="button" class="btn plain" data-close>Cancelar</button><button type="button" class="btn" id="psave">Guardar todo</button></div></div>`;

  };
  tb.addEventListener('input', e => { if (e.target.dataset.money !== undefined) liveMoney(e.target); totals(); });
  tb.addEventListener('change', e => { const c = e.target.dataset.c, tr = e.target.closest('tr'); if (c === 'moneda') syncCot(tr); if (c === 'medio') syncChq(tr); if (c === 'tipo') syncTipo(tr); if (e.target.dataset.miss) e.target.dataset.miss = ''; totals(); });

    e.preventDefault();
    const cell = e.target.closest('[data-c]'); if (!cell) return;
    const ri = [...tb.rows].indexOf(cell.closest('tr')), ci = C.indexOf(cell.dataset.c);
    const lines = text.replace(/\r/g, '').split('\n'); if (lines.length && lines[lines.length - 1] === '') lines.pop();
    lines.forEach((line, li) => { const tr = tb.rows[ri + li] || addRow(); const cells = line.split('\t'); cells.forEach((v, k) => { const col = C[ci + k]; if (col && col !== 'fpago' && col !== 'nro') setCell(tr, col, v); }); cells.forEach((v, k) => { const col = C[ci + k]; if (col === 'fpago' || col === 'nro') setCell(tr, col, v); }); });

        if (e.length) errs.push(`Fila ${i + 1}: ${e.join(', ')}`); else tras.push({ tr, p: { fecha, cuenta_origen: g('cuenta'), cuenta_destino: g('destino'), importe: imp, concepto: concepto || null } });
        return;
      }
      const e = [], fecha = parseDateFlex(g('fecha')), rubro = lookups.rubros.find(r => String(r.id) === g('rubro')), usd = g('moneda') === 'USD', cot = parseMoney(g('cotiz'));
      const chq = g('medio') !== 'Transferencia', fpago = chq ? parseDateFlex(g('fpago')) : null;
      if (!fecha) e.push('fecha inválida (usá dd/mm/aaaa)');
      if (chq && !fpago) e.push('falta la fecha de pago del cheque o echeq');
      if (cellOf(tr, 'obra').dataset.miss) e.push(`no encontré la obra "${cellOf(tr, 'obra').dataset.miss}"`);
      if (!rubro) e.push(cellOf(tr, 'rubro').dataset.miss ? `no encontré el rubro "${cellOf(tr, 'rubro').dataset.miss}"` : 'falta el rubro'); else if (rubro.tipo !== (g('tipo') === 'ingreso' ? 'ingreso' : 'gasto')) e.push('el rubro no corresponde al tipo');
      if (!concepto) e.push('falta el concepto');
      if (!(imp > 0)) e.push('falta el importe');
      if (usd && !(cot > 1)) e.push('falta la cotización');
      tr.classList.toggle('bad', e.length > 0);
      if (e.length) errs.push(`Fila ${i + 1}: ${e.join(', ')}`);
      else out.push({ tr, p: { fecha, tipo: g('tipo'), cuenta: g('cuenta'), medio: g('medio'), fecha_pago: fpago, nro_cheque: chq ? g('nro') || null : null, rubro_id: Number(g('rubro')), obra_id: g('obra') ? Number(g('obra')) : null, concepto, moneda: usd ? 'USD' : 'ARS', cotizacion: usd ? cot : 1, monto_moneda: imp } });
    });
    const fail = t => { box.innerHTML = t; box.hidden = false; box.scrollIntoView({ block: 'nearest' }); };
    if (errs.length) return fail('No se guardó nada. Corregí estas filas (están marcadas):<br>' + errs.slice(0, 8).map(esc).join('<br>') + (errs.length > 8 ? `<br>y ${errs.length - 8} más.` : ''));
    if (!out.length && !tras.length) return fail('No hay filas para guardar. Completá al menos una fila.');
    box.hidden = true; btn.disabled = true;
    if (out.length) {
      const { error } = await sb.from('banco_movimientos').insert(out.map(o => o.p));
      if (error) { btn.disabled = false; return fail(esc(niceError(error))); }
      if (tras.length) out.forEach(o => o.tr.remove());
    }
    if (tras.length) {
      const { error } = await sb.from('banco_traspasos').insert(tras.map(o => o.p));
      if (error) { btn.disabled = false; return fail(`Se guardaron ${out.length} movimientos, pero los movimientos entre cuentas no: ${esc(niceError(error))}<br>Las filas que quedan en la planilla son las que falta guardar.`); }
    }
    btn.disabled = false; dlg.close(); const n = out.length + tras.length; toast(`${n} ${n === 1 ? 'movimiento guardado' : 'movimientos guardados'}`); await onDone?.();
  };
  totals(); dlg.showModal(); cellOf(tb.rows[0], 'concepto').focus();
}

/* ---- calendario de cheques y echeqs (Inicio) ---- */
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const DIAS_CORTOS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const calState = { y: new Date().getFullYear(), m: new Date().getMonth() };
async function renderCalendario(box, onChange) {
  const { y, m } = calState, ym = `${y}-${pad(m + 1)}`, hoy = todayStr();
  const { data, error } = await sb.from('banco_movimientos').select('*').in('medio', ['Cheque', 'Echeq']).neq('estado', 'anulado').gte('fecha_pago', ym + '-01').lte('fecha_pago', lastDay(ym)).order('fecha_pago');
  if (error) { box.innerHTML = `<div class="msg err">${esc(niceError(error))}</div>`; return; }
  const byDay = {}; data.forEach(r => (byDay[r.fecha_pago] ||= []).push(r));
  const vig = data.filter(r => r.estado === 'vigente');
  const aPagar = sum(vig.filter(r => r.tipo === 'egreso'), 'importe'), aCobrar = sum(vig.filter(r => r.tipo === 'ingreso'), 'importe');
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, dias = new Date(y, m + 1, 0).getDate();
  let cells = DIAS_CORTOS.map(d => `<div class="dow">${d}</div>`).join('') + '<div class="day blank"></div>'.repeat(offset);
  for (let d = 1; d <= dias; d++) {
    const iso = `${ym}-${pad(d)}`, list = byDay[iso] || [];
    cells += `<div class="day${list.length ? ' has' : ''}${iso === hoy ? ' today' : ''}"><span class="dn">${d}<small class="dw">${DIAS_CORTOS[(offset + d - 1) % 7]}</small></span>${list.map(r => {
      const who = r.proveedor_id ? lookupLabel('proveedores', r.proveedor_id) : r.concepto;
      return `<button type="button" class="chq ${r.tipo === 'egreso' ? 'egr' : 'ing'}${r.estado === 'rechazado' ? ' rech' : ''}" data-id="${r.id}" title="${esc(`${r.medio} ${r.nro_cheque ? 'Nº ' + r.nro_cheque + ' · ' : ''}${r.concepto} · ${r.cuenta}${r.estado === 'rechazado' ? ' · RECHAZADO' : ''}`)}"><b>${fmtMoney(r.importe)}</b><span>${esc(r.medio)} · ${esc(who || '')}</span></button>`;
    }).join('')}</div>`;
  }
  cells += '<div class="day blank"></div>'.repeat((7 - (offset + dias) % 7) % 7);
  box.innerHTML = `<div class="cal-head"><button type="button" class="btn plain" data-cal="-1" aria-label="Mes anterior">‹</button><h4>${MESES[m]} ${y}</h4><button type="button" class="btn plain" data-cal="1" aria-label="Mes siguiente">›</button><button type="button" class="btn plain" data-cal="0">Hoy</button>
    <span class="muted cal-sum">A pagar: <b>${fmtMoney(aPagar)}</b> · A cobrar: <b>${fmtMoney(aCobrar)}</b> · ${data.length} ${data.length === 1 ? 'cheque o echeq' : 'cheques y echeqs'}</span></div>
    <div class="cal">${cells}</div>
    <p class="muted" style="margin-top:8px"><span class="dot egr"></span> A pagar <span class="dot ing" style="margin-left:12px"></span> A cobrar. ${data.length ? 'Tocá uno para verlo o editarlo.' : 'Cuando cargues un cheque o echeq en Banco, aparece acá el día de su fecha de pago.'}</p>`;
  box.onclick = async e => {
    const nav = e.target.closest('[data-cal]');
    if (nav) { const d = Number(nav.dataset.cal); if (d === 0) { calState.y = new Date().getFullYear(); calState.m = new Date().getMonth(); } else { const n = new Date(y, m + d, 1); calState.y = n.getFullYear(); calState.m = n.getMonth(); } return renderCalendario(box, onChange); }
    const chip = e.target.closest('.chq'); if (!chip) return;
    const row = data.find(r => String(r.id) === chip.dataset.id); if (row) openForm('banco', row, onChange);
  };
}

  { l:'Concepto', k:'concepto' }, { l:'Proveedor', k:'proveedor_id', t:'fk', ref:'proveedores' },

async function fetchCajaAll(f) {
  const rows = []; let from = 0;
  for (;;) {
    let q = sb.from('v_caja').select('*').order('fecha', { ascending: false }).order('origen', { ascending: true }).order('origen_id', { ascending: false }).range(from, from + 999);
    if (f.hasta) q = q.lte('fecha', f.hasta);
    if (f.tipo) q = q.eq('tipo', f.tipo);
    if (f.origen) q = q.eq('origen', f.origen);
    for (const [k, col] of [['rubro', 'rubro_id'], ['obra', 'obra_id'], ['proveedor', 'proveedor_id']]) {
      if (f[k] === '_none') q = q.is(col, null); else if (f[k]) q = q.eq(col, f[k]);
    }
    const { data, error } = await q;
    if (error) return { error };
    rows.push(...data);
    if (data.length < 1000) return { rows };
    if (rows.length >= 20000) return { rows, truncated: true };
    from += 1000;
  }
}

async function inflateRaw(raw) {
  const s = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));

}
async function sheetToText(file, maxRows = 500) {

  const bad = () => new Error('No pude leer ese Excel. Abrilo y guardalo de nuevo como .xlsx.');
  let z; try { z = await unzip(await file.arrayBuffer()); } catch (_) { throw bad(); }
  const xml = n => z[n] ? new DOMParser().parseFromString(new TextDecoder().decode(z[n]), 'application/xml') : null;
  const wb = xml('xl/workbook.xml'); if (!wb) throw bad();
  const relMap = {}; [...(xml('xl/_rels/workbook.xml.rels')?.getElementsByTagName('Relationship') || [])].forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));
  const sst = xml('xl/sharedStrings.xml');

      const cells = [];
      for (const c of row.getElementsByTagName('c')) {
        const ref = (c.getAttribute('r') || '').replace(/\d+/g, ''), col = [...ref].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
        const t = c.getAttribute('t'), s = Number(c.getAttribute('s') || 0);
        let v = c.getElementsByTagName('v')[0]?.textContent ?? '';

}
async function comprimirImagen(file, max = 1800) {
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('x')), 'image/jpeg', 0.85));
    return { blob, mime: 'image/jpeg', name: file.name.replace(/\.[^.]+$/, '') + '.jpg' };
  } catch (_) {
    if (['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return { blob: file, mime: file.type, name: file.name };
    throw new Error('No pude abrir esa imagen. Probá con una foto JPG o PNG.');
  }
}
async function prepararArchivo(file) {
  const ext = extOf(file.name);

  if (ext === 'xls') throw new Error('Los .xls viejos no se pueden leer. Abrilo en Excel y guardalo como .xlsx.');
  if (isSheetFile(file.name)) return { blob: file, name: file.name, mime: MIME_EXT[ext], texto: await sheetToText(file) };
  if (ext === 'pdf') return { blob: file, name: file.name, mime: 'application/pdf' };
  if (file.type.startsWith('image/') || ['jpg', 'jpeg', 'png', 'webp', 'heic', 'heif'].includes(ext)) return await comprimirImagen(file);
  throw new Error('Formato no admitido. Usá foto, PDF, .xlsx o .csv.');
}
async function subirDocumento(p, destino, obraId) {
  const seguro = p.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);
  const ruta = `${session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${seguro}`;

  const { data, error } = await sb.from('documentos').insert({ nombre: p.name, ruta, mime: p.mime, tamano: p.blob.size, destino, estado: 'subido', obra_id: obraId ? Number(obraId) : null }).select().single();

async function llamarIA(doc, destino, texto) {

}
async function abrirDoc(id) {

}

    else if (col === 'obra') { const n = norm(v), gen = /^(empresa|general|sin obra)/.test(n), o = n && !gen ? lookups.obras.find(x => norm(x.nombre) === n || norm(x.codigo) === n) || lookups.obras.find(x => norm(x.nombre).includes(n)) : null; el.value = o ? o.id : ''; el.dataset.miss = !o && n && !gen ? v : ''; }

/* ---- gastos por rubro y por obra ---- */
async function repGastos() {
  const y = todayStr().slice(0, 4);
  reportShell('Gastos por rubro y obra', 'Cuánto gasta la empresa en cada ítem y cómo se reparte entre obras. Incluye compras, combustible, mantenimiento y gastos de caja.',
    `<div class="toolbar"><div class="field"><label for="gd">Desde</label><input id="gd" type="month" value="${y}-01"></div><div class="field"><label for="gh">Hasta</label><input id="gh" type="month" value="${monthNow()}"></div></div>`);
  const run = async () => {
    const { data, error } = await sb.rpc('gastos_por_rubro_obra', { p_desde: $('#gd').value + '-01', p_hasta: lastDay($('#gh').value) });
    if (error) { $('#rep').innerHTML = `<div class="msg err">${esc(niceError(error))}</div>`; return; }
    if (!data.length) { $('#rep').innerHTML = '<div class="tablewrap"><div class="empty"><b>No hay gastos en este período</b>Cargá facturas, combustible, mantenimiento o movimientos de caja.</div></div>'; $('#csv').onclick = () => toast('No hay datos para descargar.'); return; }
    const obraIds = [...new Set(data.map(d => d.obra_id))].sort((a, b) => (a === null) - (b === null) || (lookupLabel('obras', a) || '').localeCompare(lookupLabel('obras', b) || ''));
    const rubroIds = [...new Set(data.map(d => d.rubro_id))];
    const cell = new Map(data.map(d => [`${d.rubro_id}|${d.obra_id}`, Number(d.importe)]));
    const rows = rubroIds.map(rid => { const vals = Object.fromEntries(obraIds.map(o => [o, cell.get(`${rid}|${o}`) || 0])); return { rubro: rid === null ? 'Sin rubro' : lookupLabel('rubros', rid), vals, total: sum(Object.values(vals), x => x) }; }).sort((a, b) => b.total - a.total);
    const grand = sum(rows, 'total');
    rows.forEach(r => r.pct = grand ? r.total / grand * 100 : 0);

    const tot = { 'Total': fmtMoney(grand) };

async function fetchBancoAll(f) {
  const rows = []; let from = 0;
  for (;;) {
    let q = sb.from('v_banco').select('*').order('fecha', { ascending: false }).order('origen', { ascending: true }).order('origen_id', { ascending: false }).range(from, from + 999);
    if (f.hasta) q = q.lte('fecha', f.hasta);
    if (f.tipo === 'traspaso') q = q.eq('origen', 'traspaso'); else if (f.tipo) q = q.eq('tipo', f.tipo).neq('origen', 'traspaso');
    if (f.origen) q = q.eq('origen', f.origen);
    if (f.cuenta) q = q.eq('cuenta', f.cuenta);
    if (f.medio) q = q.eq('medio', f.medio);
    for (const [k, col] of [['rubro', 'rubro_id'], ['obra', 'obra_id'], ['proveedor', 'proveedor_id']]) {
      if (f[k] === '_none') q = q.is(col, null); else if (f[k]) q = q.eq(col, f[k]);
    }
    const { data, error } = await q;
    if (error) return { error };
    rows.push(...data);
    if (data.length < 1000) return { rows };
    if (rows.length >= 20000) return { rows, truncated: true };
    from += 1000;
  }
}

      const fechas = rowsIn.map(x => x.fecha).sort(), tot = r2(rowsIn.reduce((a, x) => a + x.iva, 0));
      const txt = `Encontré ${rowsIn.length} comprobantes ${sent === 'recibido' ? 'RECIBIDOS (compras)' : sent === 'emitido' ? 'EMITIDOS (ventas)' : 'recibidos y emitidos'}, del ${fmtDate(fechas[0])} al ${fmtDate(fechas[fechas.length - 1])}, con IVA total ${fmtMoney(tot)}. ¿Los cargo para comparar?` + (r.via === 'ia' ? ' Fueron leídos con IA: revisá las diferencias antes de darlos por buenos.' : '');
      if (!(await askConfirm(txt, 'Cargar', 'Si importás dos veces el mismo archivo, no se duplican los comprobantes.'))) { box.innerHTML = ''; btn.disabled = false; return; }
      for (let i = 0; i < rowsIn.length; i += 500) {
        const { error } = await sb.from('afip_comprobantes').upsert(rowsIn.slice(i, i + 500).map(x => ({ sentido: x.sentido, fecha: x.fecha, tipo_comprobante: x.tipo_comprobante || '', punto_venta: x.punto_venta, numero: x.numero, cuit: x.cuit || '', denominacion: x.denominacion, neto_gravado: x.neto_gravado, iva: x.iva, total: x.total, cae: x.cae })), { onConflict: 'sentido,cuit,tipo_comprobante,punto_venta,numero' });

    const isC = !!r._c;
    if (r.s) return openForm(isC ? 'facturas' : 'emitidas', r.s.raw, refresh);
