    const a = r.a, pl = `${String(a.punto_venta).padStart(4, '0')}-${String(a.numero).padStart(8, '0')}`, party = (isC ? lookups.proveedores : lookups.clientes).find(p => a.cuit && digits(p.cuit) === a.cuit);
    const tipo = OPT.comprobante.map(x => x[0]).find(t => t === a.tipo_comprobante) || '';
    openForm(isC ? 'facturas' : 'emitidas', null, refresh, { fecha: a.fecha, nro_comprobante: pl, tipo_comprobante: tipo, importe: a.total, iva: a.iva, [isC ? 'proveedor_id' : 'cliente_id']: party?.id, concepto: isC ? '' : '', observaciones: party ? '' : `Cargado desde AFIP: ${a.denominacion || ''} (CUIT ${a.cuit})` });
  };
  $('#flist').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) open(tr); });
  $('#flist').addEventListener('keydown', e => { if (e.key === 'Enter') { const tr = e.target.closest('tr[data-id]'); if (tr) open(tr); } });
  run();
}

/* ================= Presupuesto vs real por obra ================= */
const presState = { obra: '' };
async function repPresupuesto() {
  const st = presState, obras = lookups.obras;
  if (!st.obra || !obras.some(o => String(o.id) === String(st.obra))) st.obra = (obras.find(o => o.estado === 'en_ejecucion') || obras[0] || {}).id || '';
  reportShell('Presupuesto vs real', 'Cuánto presupuestaste en cada rubro de la obra y cuánto llevás gastado. Escribí el presupuesto de cada rubro y se guarda solo.',
    `<div class="toolbar"><div class="field"><label for="po">Obra</label><select id="po">${obras.map(o => `<option value="${o.id}">${esc(LK.obras(o))}</option>`).join('')}</select></div></div>`);
  if (!obras.length) { $('#rep').innerHTML = '<div class="tablewrap"><div class="empty"><b>No hay obras</b>Creá una obra para cargarle presupuesto.</div></div>'; $('#csv').onclick = () => toast('No hay datos para descargar.'); return; }
  $('#po').value = st.obra;
  let rowsData = [];
  const run = async () => {
    const [g, p, ob] = await Promise.all([
      sb.rpc('gastos_por_rubro_obra', { p_desde: '1900-01-01', p_hasta: '2999-12-31' }),
      sb.from('obra_presupuesto_rubros').select('*').eq('obra_id', st.obra),
      sb.from('obras').select('presupuesto_costos,monto_contrato').eq('id', st.obra).maybeSingle()
    ]);
    const err = g.error || p.error || ob.error; if (err) { $('#rep').innerHTML = `<div class="msg err">${esc(niceError(err))}</div>`; return; }
    const gasto = new Map(), pres = new Map(p.data.map(x => [x.rubro_id, Number(x.monto)]));
    g.data.filter(x => String(x.obra_id) === String(st.obra)).forEach(x => gasto.set(x.rubro_id, (gasto.get(x.rubro_id) || 0) + Number(x.importe)));
    const ids = [...new Set([...lookups.rubros.filter(r => r.tipo === 'gasto').map(r => r.id), ...gasto.keys(), ...pres.keys()].filter(x => x !== null))];
    rowsData = ids.map(id => ({ rubro_id: id, nombre: lookupLabel('rubros', id), pres: pres.get(id) || 0, gasto: gasto.get(id) || 0 })).sort((a, b) => (b.gasto + b.pres) - (a.gasto + a.pres) || a.nombre.localeCompare(b.nombre));
    if (gasto.has(null)) rowsData.push({ rubro_id: null, nombre: 'Sin rubro', pres: 0, gasto: gasto.get(null) });
    window.__presTop = ob.data;
    draw();
  };
  const pct = r => r.pres > 0 ? r.gasto / r.pres * 100 : (r.gasto > 0 ? Infinity : 0);
  const tone = x => x > 100 ? 'var(--bad, #B3261E)' : x >= 80 ? '#C98A00' : 'var(--good, #2E7D4F)';
  const draw = () => {
    const tp = r2(rowsData.reduce((a, r) => a + r.pres, 0)), tg = r2(rowsData.reduce((a, r) => a + r.gasto, 0)), top = Number(window.__presTop?.presupuesto_costos) || 0, cto = Number(window.__presTop?.monto_contrato) || 0;
    const tpc = tp > 0 ? tg / tp * 100 : 0;
    const cols = [{ l: 'Rubro', k: 'nombre' }, { l: 'Presupuestado', t: 'money', v: r => r.pres }, { l: 'Gastado', t: 'money', v: r => r.gasto }, { l: 'Disponible', t: 'money', v: r => r.pres - r.gasto }, { l: '% usado', t: 'num', dec: 0, v: r => r.pres > 0 ? Math.round(r.gasto / r.pres * 100) : null }];
    $('#rep').innerHTML = `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      <div class="stat"><span>Presupuesto por rubros</span><b>${fmtMoney(tp)}</b><small>${top ? 'Presupuesto de costos de la obra: ' + fmtMoney(top) : 'Suma de lo cargado abajo'}</small></div>
      <div class="stat"><span>Gastado hasta hoy</span><b>${fmtMoney(tg)}</b>${cto ? `<small>${Math.round(tg / cto * 100)}% del contrato (${fmtMoney(cto)})</small>` : ''}</div>
      <div class="stat${tp - tg < 0 ? ' neg' : ''}"><span>${tp - tg >= 0 ? 'Disponible' : 'Pasado del presupuesto'}</span><b>${fmtMoney(Math.abs(tp - tg))}</b><small>${tp > 0 ? Math.round(tpc) + '% del presupuesto usado' : 'Cargá el presupuesto de los rubros'}</small></div></div>
      ${top && tp && Math.abs(top - tp) > 1 ? `<div class="msg" style="margin-top:12px">La suma por rubros (${fmtMoney(tp)}) no coincide con el presupuesto de costos de la obra (${fmtMoney(top)}).</div>` : ''}
      <div class="tablewrap" style="margin-top:18px"><table><thead><tr><th>Rubro</th><th class="num">Presupuestado</th><th class="num">Gastado</th><th class="num">Disponible</th><th style="width:22%">Uso</th></tr></thead><tbody>
      ${rowsData.map((r, i) => { const x = pct(r), w = Math.min(100, Number.isFinite(x) ? x : 100); return `<tr><td>${esc(r.nombre)}</td><td class="num">${r.rubro_id !== null && canEdit() ? `<input class="pin" data-i="${i}" data-money inputmode="decimal" placeholder="0,00" value="${r.pres ? esc(moneyStr(r.pres)) : ''}" aria-label="Presupuesto de ${esc(r.nombre)}" style="width:150px;text-align:right">` : fmtMoney(r.pres)}</td><td class="num">${fmtMoney(r.gasto)}</td><td class="num"${r.pres - r.gasto < 0 ? ' style="color:var(--bad,#B3261E)"' : ''}>${r.pres || r.gasto ? fmtMoney(r.pres - r.gasto) : ''}</td><td>${r.pres || r.gasto ? `<span class="bar" style="width:${w}%;background:${tone(x)}"></span> <small>${Number.isFinite(x) ? Math.round(x) + '%' : 'sin presupuesto'}</small>` : ''}</td></tr>`; }).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${fmtMoney(tp)}</td><td class="num">${fmtMoney(tg)}</td><td class="num">${fmtMoney(tp - tg)}</td><td></td></tr></tfoot></table></div>
      <p class="muted" style="margin-top:8px">Verde: menos del 80% usado. Amarillo: entre 80% y 100%. Rojo: se pasó del presupuesto. El gasto incluye facturas, combustible, mantenimiento, caja y banco.</p>`;
    $('#csv').onclick = () => downloadTable('presupuesto-vs-real.xlsx', cols, rowsData, 'Presupuesto');
  };
  $('#po').addEventListener('change', e => { st.obra = e.target.value; run(); });
  $('#rep').addEventListener('input', e => { if (e.target.dataset.money !== undefined) liveMoney(e.target); });
  $('#rep').addEventListener('change', async e => {
    const el = e.target.closest('.pin'); if (!el) return;
    const r = rowsData[Number(el.dataset.i)], v = parseMoney(el.value);
    el.value = v === '' ? '' : moneyStr(v);
    const res = v === '' || v <= 0 ? await sb.from('obra_presupuesto_rubros').delete().eq('obra_id', st.obra).eq('rubro_id', r.rubro_id)
      : await sb.from('obra_presupuesto_rubros').upsert({ obra_id: Number(st.obra), rubro_id: r.rubro_id, monto: v, updated_at: new Date().toISOString() }, { onConflict: 'obra_id,rubro_id' });
    if (res.error) return toast(niceError(res.error));
    r.pres = v === '' || v <= 0 ? 0 : v; const y = window.scrollY; draw(); window.scrollTo(0, y);
  });
  run();
}

/* ================= Flujo de fondos proyectado ================= */
const flujoState = { semanas: 12, atrasados: false };
async function repFlujo() {
  const st = flujoState;
  reportShell('Flujo de fondos', 'Con lo que tenés hoy, lo que vas a cobrar y lo que vas a pagar, cuánta plata tendrías semana a semana.',
    `<div class="toolbar"><div class="field"><label for="fs">Horizonte</label><select id="fs">${[4, 8, 12, 26].map(n => `<option value="${n}">${n} semanas</option>`).join('')}</select></div>
     <div class="field"><label for="fa">Cobros atrasados</label><select id="fa"><option value="0">No los cuento (conservador)</option><option value="1">Los cuento en la semana 1</option></select></div></div>`);
  $('#fs').value = st.semanas; $('#fa').value = st.atrasados ? '1' : '0';
  const hoy = todayStr(), dias = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
  const [sd, ct, cc, fp, bk] = await Promise.all([
    sb.rpc('banco_saldos', { p_hasta: hoy }), sb.rpc('caja_totales', { p_desde: '1900-01-01', p_hasta: hoy }),
    sb.from('cuentas_cliente').select('id,obra_id,fecha,concepto,importe,vencimiento').eq('estado', 'pendiente'),
    sb.from('v_facturas_saldo').select('id,proveedor_id,obra_id,fecha,tipo_comprobante,nro_comprobante,concepto,vencimiento,saldo').gt('saldo', 0),
    sb.from('v_banco').select('*').eq('acreditado', false).eq('estado', 'vigente').neq('origen', 'traspaso')
  ]);
  const err = sd.error || ct.error || cc.error || fp.error || bk.error; if (err) { $('#rep').innerHTML = `<div class="msg err">${esc(niceError(err))}</div>`; return; }
  const items = [];
  cc.data.forEach(x => items.push({ f: x.vencimiento || x.fecha, in: Number(x.importe), t: 'Cobro a cliente', d: `${lookupLabel('obras', x.obra_id) || 'Sin obra'} · ${x.concepto || ''}` }));
  fp.data.forEach(x => items.push({ f: x.vencimiento || x.fecha, out: Number(x.saldo), t: 'Factura de proveedor', d: `${lookupLabel('proveedores', x.proveedor_id)} · ${[x.tipo_comprobante, x.nro_comprobante].filter(Boolean).join(' ') || x.concepto || ''}` }));
  bk.data.forEach(x => items.push({ f: x.fecha, [x.tipo === 'ingreso' ? 'in' : 'out']: Number(x.importe), t: x.origen === 'impuesto' ? 'Impuesto D/C' : (x.medio || 'Banco'), d: `${x.cuenta} · ${x.concepto || ''}` }));
  const disponible = r2((sd.data || []).reduce((a, x) => a + Number(x.saldo), 0) + (Number(ct.data?.[0]?.ingresos) || 0) - (Number(ct.data?.[0]?.egresos) || 0));
  let B = [];
  const build = () => {
    const n = st.semanas; B = [{ k: 'atr', label: 'Atrasado', from: null, to: null, in: 0, out: 0, it: [] }, ...Array.from({ length: n }, (_, i) => ({ k: i, label: `Semana ${i + 1}`, from: inDays(i * 7), to: inDays(i * 7 + 6), in: 0, out: 0, it: [] }))];
    items.forEach(x => {
      const dd = dias(x.f, hoy); let b;
      if (dd < 0) b = B[0]; else { const w = Math.floor(dd / 7); if (w >= n) return; b = B[w + 1]; }
      b.in += x.in || 0; b.out += x.out || 0; b.it.push(x);
    });
    let saldo = disponible;
    B.forEach((b, i) => {
      b.in = r2(b.in); b.out = r2(b.out);
      if (i === 0) { const cobra = st.atrasados ? b.in : 0; b.net = r2(cobra - b.out); saldo = r2(saldo + b.net); b.saldo = saldo; b.nota = st.atrasados ? '' : 'Los cobros atrasados no se cuentan'; }
      else { b.net = r2(b.in - b.out); saldo = r2(saldo + b.net); b.saldo = saldo; }
    });
  };
  const cols = [{ l: 'Período', v: b => b.k === 'atr' ? 'Atrasado (ya vencido)' : `${b.label} · ${fmtDate(b.from)} al ${fmtDate(b.to)}` }, { l: 'Cobros', t: 'money', v: b => b.in }, { l: 'Pagos', t: 'money', v: b => b.out }, { l: 'Neto', t: 'money', v: b => b.net }, { l: 'Saldo proyectado', t: 'money', v: b => b.saldo }];
  const draw = () => {
    build();
    const totIn = r2(B.reduce((a, b) => a + b.in, 0) - (st.atrasados ? 0 : B[0].in)), totOut = r2(B.reduce((a, b) => a + b.out, 0));
    const min = B.reduce((m, b) => b.saldo < m.saldo ? b : m, B[0]), fin = B[B.length - 1].saldo, atrIn = B[0].in;
    $('#rep').innerHTML = `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      <div class="stat${disponible < 0 ? ' neg' : ''}"><span>Disponible hoy</span><b>${fmtMoney(disponible)}</b><small>Banco + caja en efectivo</small></div>
      <div class="stat"><span>Cobros previstos</span><b>${fmtMoney(totIn)}</b><small>${atrIn && !st.atrasados ? 'Hay ' + fmtMoney(atrIn) + ' de cobros atrasados sin contar' : 'En las próximas ' + st.semanas + ' semanas'}</small></div>
      <div class="stat"><span>Pagos previstos</span><b>${fmtMoney(totOut)}</b><small>Facturas y cheques, incluye lo vencido</small></div>
      <div class="stat${fin < 0 ? ' neg' : ''}"><span>Saldo al final</span><b>${fmtMoney(fin)}</b></div>
      <div class="stat${min.saldo < 0 ? ' neg' : ''}"><span>Saldo más bajo</span><b>${fmtMoney(min.saldo)}</b><small>${min.k === 'atr' ? 'Hoy, con lo atrasado' : min.label}</small></div></div>
      ${min.saldo < 0 ? `<div class="msg err" style="margin-top:12px">Con lo cargado hoy, te quedarías sin fondos en ${min.k === 'atr' ? 'este momento' : min.label.toLowerCase() + ' (' + fmtDate(min.from) + ')'}. Conviene adelantar cobros o renegociar pagos.</div>` : ''}
      <div class="tablewrap" style="margin-top:18px"><table><thead><tr><th>Período</th><th class="num">Cobros</th><th class="num">Pagos</th><th class="num">Neto</th><th class="num">Saldo proyectado</th></tr></thead><tbody>
      ${B.map((b, i) => `<tr data-i="${i}" tabindex="0"${b.saldo < 0 ? ' style="background:var(--bad-soft,#FBE9E7)"' : ''}><td>${b.k === 'atr' ? 'Atrasado (ya vencido)' : `${b.label} <span class="muted">· ${fmtDate(b.from)} al ${fmtDate(b.to)}</span>`}</td><td class="num">${fmtMoney(b.in)}</td><td class="num">${fmtMoney(b.out)}</td><td class="num">${fmtMoney(b.net)}</td><td class="num"><b>${fmtMoney(b.saldo)}</b></td></tr>`).join('')}</tbody></table></div>
      <div id="fdet"></div>
      <p class="muted" style="margin-top:8px">Cobros: certificados o cobros pendientes de clientes y cheques a cobrar. Pagos: facturas de proveedores con saldo y cheques a pagar. No incluye sueldos ni gastos que todavía no cargaste. Tocá una fila para ver el detalle.</p>`;
    $('#csv').onclick = () => downloadTable('flujo-de-fondos.xlsx', cols, B, 'Flujo');
  };
  $('#fs').addEventListener('change', e => { st.semanas = Number(e.target.value); draw(); });
  $('#fa').addEventListener('change', e => { st.atrasados = e.target.value === '1'; draw(); });
  $('#rep').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-i]'); if (!tr) return; const b = B[Number(tr.dataset.i)];
    $('#fdet').innerHTML = b.it.length ? `<h3 style="margin:18px 0 8px">Detalle: ${b.k === 'atr' ? 'atrasado' : b.label}</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="num">Cobro</th><th class="num">Pago</th></tr></thead><tbody>${[...b.it].sort((x, y) => x.f < y.f ? -1 : 1).map(x => `<tr><td>${fmtDate(x.f)}</td><td>${esc(x.t)}</td><td>${esc(x.d)}</td><td class="num">${x.in ? fmtMoney(x.in) : ''}</td><td class="num">${x.out ? fmtMoney(x.out) : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin-top:12px">No hay movimientos en este período.</p>';
  });
  draw();
}

/* ================= acceso ================= */
function showConfig(msg) {
  $('#root').innerHTML = `<div class="gate"><div class="gate-deco" aria-hidden="true">${skyline('gd')}</div><form class="gate-box" id="cfg"><img class="logo" src="${LOGO_LIGHT}" alt="CODES Construcciones"><h1>Sistema de gestión</h1><p>Conectá la app con tu proyecto de Supabase. Los dos datos están en Project Settings → API.</p>
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
    <div class="field"><label for="u">URL del proyecto</label><input id="u" required placeholder="https://xxxx.supabase.co" inputmode="url"></div>
    <div class="field"><label for="k">Clave pública (anon)</label><input id="k" required></div>
    <button class="btn" style="width:100%">Continuar</button></form></div>`;
  $('#cfg').onsubmit = e => {
    e.preventDefault();
    const url = $('#u').value.trim().replace(/\/+$/, ''), anonKey = $('#k').value.trim();
    if (!/^https:\/\/.+\..+/.test(url)) return showConfig('La URL debe empezar con https:// y ser la de tu proyecto.');
    try { localStorage.setItem(LS_KEY, JSON.stringify({ url, anonKey })); } catch (_) {}
    init({ url, anonKey });
  };
}

function showLogin(mode = 'in', note = '') {
  const up = mode === 'up';
  $('#root').innerHTML = `<div class="gate"><div class="gate-deco" aria-hidden="true">${skyline('gd')}</div><form class="gate-box" id="lg"><img class="logo" src="${LOGO_LIGHT}" alt="CODES Construcciones"><h1>Sistema de gestión</h1><p>${up ? 'Creá tu cuenta para entrar al sistema.' : 'Ingresá con tu cuenta.'}</p>
    <div class="msg err" id="lerr" hidden></div>${note ? `<div class="msg ok">${esc(note)}</div>` : ''}
    ${up ? '<div class="field"><label for="n">Nombre y apellido</label><input id="n" autocomplete="name" required></div>' : ''}
    <div class="field"><label for="e">Email</label><input id="e" type="email" autocomplete="email" required></div>
    <div class="field"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" minlength="6" required></div>
    ${up ? '<div class="field"><label for="cd">Código de acceso</label><input id="cd" autocomplete="off" required style="text-transform:uppercase"><span class="hint">Te lo da el administrador.</span></div>' : ''}
    <button class="btn" style="width:100%" id="go">${up ? 'Crear cuenta' : 'Entrar'}</button>
    <p style="margin:14px 0 0;text-align:center">${up ? '¿Ya tenés cuenta?' : '¿Primera vez?'} <button type="button" class="link" id="sw">${up ? 'Ingresar' : 'Crear cuenta'}</button></p>
    <p style="margin:8px 0 0;text-align:center"><button type="button" class="link" id="rc">Cambiar proyecto de Supabase</button></p></form></div>`;
  $('#sw').onclick = () => showLogin(up ? 'in' : 'up');
  $('#rc').onclick = () => { try { localStorage.removeItem(LS_KEY); } catch (_) {} showConfig(); };
  $('#lg').onsubmit = async e => {
    e.preventDefault();
    const err = t => { const b = $('#lerr'); b.textContent = t; b.hidden = false; };
    $('#go').disabled = true;
    const email = $('#e').value.trim(), password = $('#p').value;
    if (up) {
      const codigo = $('#cd').value.trim().toUpperCase();
      const ok = await sb.rpc('codigo_valido', { p_codigo: codigo });
      if (ok.error || ok.data !== true) { $('#go').disabled = false; return err(ok.error ? niceError(ok.error) : 'El código de acceso no es válido. Pedíselo al administrador.'); }
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { nombre: $('#n').value.trim(), codigo } } });
      $('#go').disabled = false;
      if (error) return err(niceError(error));
      if (data.session) { session = data.session; return enterApp(); }
      return showLogin('in', 'Cuenta creada. Si Supabase te pidió confirmar el email, revisá tu correo y después ingresá.');
    }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    $('#go').disabled = false;
    if (error) return err(niceError(error));
    session = data.session; enterApp();
  };
}

async function enterApp() {
  $('#root').innerHTML = '<div class="gate"><p class="muted">Cargando…</p></div>';
  try {
    const { data, error } = await sb.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
    if (error) throw error;
    if (!data || !data.activo) {
      $('#root').innerHTML = `<div class="gate"><div class="gate-box"><img class="logo" src="${LOGO_LIGHT}" alt="CODES Construcciones"><h1>Sin acceso</h1><p>Tu usuario todavía no está habilitado. Pedile al administrador que lo active.</p><button class="btn plain" id="lo">Salir</button></div></div>`;
      $('#lo').onclick = async () => { await sb.auth.signOut(); showLogin(); }; return;
    }
    perfil = data; await Promise.all([loadLookups(), loadUsers()]); showShell();
  } catch (e) {
    $('#root').innerHTML = `<div class="gate"><div class="gate-box"><img class="logo" src="${LOGO_LIGHT}" alt="CODES Construcciones"><h1>No se pudo cargar</h1><div class="msg err">${esc(niceError(e))}</div><button class="btn plain" id="lo">Salir</button></div></div>`;
    $('#lo').onclick = async () => { await sb.auth.signOut(); showLogin(); };
  }
}

async function init(cfgOverride) {
  let cfg = cfgOverride || (CONFIG.url ? CONFIG : null);
  if (!cfg) { try { cfg = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (_) {} }
  if (!cfg?.url || !cfg?.anonKey) return showConfig();
  if (typeof supabase === 'undefined') { $('#root').innerHTML = '<div class="gate"><div class="gate-box"><h1>Sin conexión</h1><div class="msg err">No se pudo cargar la librería de Supabase. Revisá tu conexión a internet y recargá.</div></div></div>'; return; }
  sb = supabase.createClient(cfg.url, cfg.anonKey);
  const { data } = await sb.auth.getSession();
  if (!data.session) return showLogin();
  session = data.session; enterApp();
}
init();
</script>
</body>
</html>
